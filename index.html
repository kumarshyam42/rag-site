<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#26314C">
<title>Project 3: Obsidian RAG System — Explorer</title>
<style>
  :root {
    --navy: #26314C;
    --navy-light: #334163;
    --navy-dark: #1a2238;
    --teal: #27BDBE;
    --teal-dim: rgba(39, 189, 190, 0.15);
    --teal-mid: rgba(39, 189, 190, 0.4);
    --gold: #FFC20E;
    --gold-dim: rgba(255, 194, 14, 0.15);
    --gold-mid: rgba(255, 194, 14, 0.4);
    --white: #FFFFFF;
    --gray-100: #f0f2f5;
    --gray-200: #d8dce4;
    --gray-300: #a0aec0;
    --gray-400: #718096;
    --gray-500: #4a5568;
    --red: #e53e3e;
    --red-dim: rgba(229, 62, 62, 0.15);
    --green: #38a169;
    --green-dim: rgba(56, 161, 105, 0.15);
    --font-ui: 'Futura', 'Century Gothic', 'Avant Garde', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    --radius: 8px;
    --radius-lg: 12px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    background: var(--navy-dark);
    color: var(--white);
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: auto 1fr;
    gap: 0;
  }

  /* ── Header ── */
  header {
    grid-column: 1 / -1;
    background: var(--navy);
    border-bottom: 1px solid rgba(39, 189, 190, 0.2);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: var(--white);
  }
  header h1 span { color: var(--teal); }

  .header-meta {
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 12px;
    color: var(--gray-300);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .status-badge.blocker { background: var(--red-dim); color: #fc8181; }
  .status-badge.done { background: var(--green-dim); color: #68d391; }
  .status-badge.pending { background: var(--gold-dim); color: var(--gold); }
  .status-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--navy);
    border-right: 1px solid rgba(39, 189, 190, 0.12);
    overflow-y: auto;
    padding: 0;
    display: flex;
    flex-direction: column;
  }

  .sidebar-section {
    padding: 16px 16px 12px;
    border-bottom: 1px solid rgba(39, 189, 190, 0.08);
  }

  .sidebar-section h3 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--gray-400);
    margin-bottom: 10px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    color: var(--gray-300);
    transition: all 0.15s;
    position: relative;
  }
  .nav-item:hover { background: rgba(39, 189, 190, 0.08); color: var(--white); }
  .nav-item.active { background: var(--teal-dim); color: var(--teal); }
  .nav-item .icon { width: 18px; text-align: center; font-size: 14px; flex-shrink: 0; }
  .nav-item .label { flex: 1; text-wrap: pretty; }
  .nav-item .tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    font-weight: 500;
  }
  .tag-done { background: var(--green-dim); color: #68d391; }
  .tag-blocker { background: var(--red-dim); color: #fc8181; }
  .tag-pending { background: var(--gold-dim); color: var(--gold); }
  .tag-blocked { background: rgba(160, 174, 192, 0.15); color: var(--gray-400); }

  /* ── Presets ── */
  .preset-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .preset-btn {
    font-family: var(--font-ui);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid rgba(39, 189, 190, 0.25);
    background: transparent;
    color: var(--teal);
    cursor: pointer;
    transition: all 0.15s;
  }
  .preset-btn:hover { background: var(--teal-dim); }
  .preset-btn.active { background: var(--teal); color: var(--navy); border-color: var(--teal); }

  /* ── Main Content ── */
  .main {
    overflow-y: auto;
    padding: 24px 32px;
    scroll-behavior: smooth;
  }

  .content-card {
    background: var(--navy);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(39, 189, 190, 0.12);
    padding: 28px 32px;
    margin-bottom: 20px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .content-card h2 {
    font-size: 20px;
    font-weight: 500;
    color: var(--white);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .content-card h2 .section-icon { font-size: 22px; }

  .content-card .subtitle {
    font-size: 13px;
    color: var(--gray-400);
    margin-bottom: 20px;
    line-height: 1.5;
    text-wrap: pretty;
  }

  .content-card h3 {
    font-size: 14px;
    font-weight: 500;
    color: var(--teal);
    margin: 20px 0 10px;
    letter-spacing: 0.3px;
  }

  .content-card p, .content-card li {
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--gray-200);
  }

  .content-card ul, .content-card ol {
    padding-left: 20px;
    margin: 8px 0;
  }
  .content-card li { margin-bottom: 4px; }

  .content-card code {
    font-family: var(--font-mono);
    font-size: 12px;
    background: rgba(39, 189, 190, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--teal);
  }

  .content-card pre {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--navy-dark);
    border: 1px solid rgba(39, 189, 190, 0.1);
    border-radius: var(--radius);
    padding: 14px 16px;
    overflow-x: auto;
    margin: 10px 0;
    line-height: 1.6;
    color: var(--gray-200);
  }

  /* Tables */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 13px;
  }
  .data-table th {
    text-align: left;
    padding: 8px 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--gray-400);
    border-bottom: 1px solid rgba(39, 189, 190, 0.15);
    font-weight: 500;
  }
  .data-table td {
    padding: 8px 12px;
    color: var(--gray-200);
    border-bottom: 1px solid rgba(39, 189, 190, 0.06);
  }
  .data-table tr:hover td { background: rgba(39, 189, 190, 0.04); }

  /* Stat cards */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin: 16px 0;
  }
  .stat-card {
    background: var(--navy-dark);
    border: 1px solid rgba(39, 189, 190, 0.1);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-align: center;
  }
  .stat-card .value {
    font-size: 26px;
    font-weight: 600;
    color: var(--teal);
    font-variant-numeric: tabular-nums;
  }
  .stat-card .value.gold { color: var(--gold); }
  .stat-card .value.red { color: #fc8181; }
  .stat-card .desc {
    font-size: 11px;
    color: var(--gray-400);
    margin-top: 4px;
    letter-spacing: 0.3px;
  }

  /* Flow diagram */
  .flow-diagram {
    display: flex;
    align-items: center;
    gap: 0;
    margin: 20px 0;
    overflow-x: auto;
    padding: 10px 0;
  }
  .flow-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 100px;
    text-align: center;
  }
  .flow-node {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border: 2px solid;
    transition: transform 0.15s;
  }
  .flow-node:hover { transform: scale(1.1); }
  .flow-node.done { background: var(--green-dim); border-color: var(--green); }
  .flow-node.current { background: var(--gold-dim); border-color: var(--gold); animation: pulse 2s infinite; }
  .flow-node.blocked { background: var(--red-dim); border-color: #fc8181; }
  .flow-node.future { background: rgba(160, 174, 192, 0.08); border-color: var(--gray-400); opacity: 0.5; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 194, 14, 0.3); } 50% { box-shadow: 0 0 0 8px rgba(255, 194, 14, 0); } }
  .flow-label { font-size: 11px; color: var(--gray-300); max-width: 90px; }
  .flow-arrow { color: var(--gray-400); font-size: 18px; margin: 0 4px; padding-bottom: 20px; }

  /* Architecture option cards */
  .arch-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 16px 0;
  }
  .arch-card {
    background: var(--navy-dark);
    border: 2px solid rgba(39, 189, 190, 0.12);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .arch-card:hover { border-color: var(--teal-mid); }
  .arch-card.selected { border-color: var(--teal); background: var(--teal-dim); }
  .arch-card h4 {
    font-size: 14px;
    font-weight: 500;
    color: var(--white);
    margin-bottom: 6px;
  }
  .arch-card p {
    font-size: 12px;
    color: var(--gray-400);
    line-height: 1.5;
  }
  .arch-card .pros, .arch-card .cons {
    font-size: 11px;
    margin-top: 8px;
    line-height: 1.6;
  }
  .arch-card .pros { color: #68d391; }
  .arch-card .cons { color: #fc8181; }

  /* Checklist */
  .checklist-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 6px 0;
    font-size: 13px;
    color: var(--gray-200);
  }
  .checklist-item .check {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1.5px solid var(--gray-400);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    font-size: 11px;
  }
  .checklist-item.done .check { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .checklist-item.pending .check { border-color: var(--gold); }
  .checklist-item.blocked .check { border-color: #fc8181; }

  /* Timeline */
  .timeline {
    position: relative;
    padding-left: 24px;
    margin: 16px 0;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 7px;
    top: 4px;
    bottom: 4px;
    width: 2px;
    background: rgba(39, 189, 190, 0.2);
  }
  .timeline-item {
    position: relative;
    padding: 8px 0 16px;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -20px;
    top: 12px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--teal);
    border: 2px solid var(--navy);
  }
  .timeline-item.s1::before { background: var(--green); }
  .timeline-item.s2::before { background: var(--green); }
  .timeline-item.s3::before { background: var(--gold); }
  .timeline-item h4 { font-size: 13px; font-weight: 500; color: var(--white); }
  .timeline-item p { font-size: 12px; color: var(--gray-400); margin-top: 3px; line-height: 1.5; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(39, 189, 190, 0.2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(39, 189, 190, 0.4); }

  /* ── Mobile Tab Bar ── */
  .mobile-tab-bar {
    display: none;
  }

  /* ── Slide-up Navigation Sheet ── */
  .sheet-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 90;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .sheet-backdrop.visible {
    opacity: 1;
  }

  .nav-sheet {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--navy);
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 80vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-bottom: var(--safe-bottom);
  }
  .nav-sheet.open {
    transform: translateY(0);
  }

  .sheet-handle {
    display: flex;
    justify-content: center;
    padding: 10px 0 6px;
    position: sticky;
    top: 0;
    background: var(--navy);
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    z-index: 1;
  }
  .sheet-handle::after {
    content: '';
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--gray-400);
  }

  .sheet-section {
    padding: 8px 20px 16px;
  }
  .sheet-section h3 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--gray-400);
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .sheet-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    color: var(--gray-300);
    transition: background 0.15s;
    min-height: 44px;
  }
  .sheet-item:active { background: rgba(39, 189, 190, 0.12); }
  .sheet-item.active { background: var(--teal-dim); color: var(--teal); }
  .sheet-item .icon { width: 22px; text-align: center; font-size: 16px; flex-shrink: 0; }
  .sheet-item .label { flex: 1; }
  .sheet-item .tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }

  .sheet-presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 4px 4px 8px;
  }
  .sheet-presets .preset-btn {
    font-size: 13px;
    padding: 8px 16px;
    min-height: 44px;
    display: flex;
    align-items: center;
  }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      height: 100%;
    }
    html { height: 100%; }
    .sidebar { display: none; }
    .arch-grid { grid-template-columns: 1fr; }

    header {
      padding: 12px 16px;
    }
    header h1 { font-size: 14px; }
    .header-meta { gap: 8px; }
    .header-meta > span:first-child { display: none; }

    .main {
      padding: 16px;
      padding-bottom: 72px;
    }

    .content-card {
      padding: 20px 18px;
      border-radius: var(--radius);
    }
    .content-card h2 { font-size: 18px; }

    .stat-row {
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
    }
    .stat-card { padding: 10px 8px; }
    .stat-card .value { font-size: 22px; }
    .stat-card .desc { font-size: 10px; }

    .flow-diagram {
      gap: 0;
      padding: 8px 0;
      -webkit-overflow-scrolling: touch;
    }
    .flow-step { min-width: 80px; }
    .flow-node { width: 40px; height: 40px; font-size: 16px; }
    .flow-label { font-size: 10px; max-width: 72px; }
    .flow-arrow { font-size: 14px; margin: 0 2px; padding-bottom: 16px; }

    .data-table { font-size: 12px; }
    .data-table th, .data-table td { padding: 6px 8px; }

    pre { font-size: 11px !important; padding: 10px 12px !important; }

    /* Show mobile tab bar — fixed to bottom of screen */
    .mobile-tab-bar {
      display: flex;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 80;
      background: var(--navy);
      border-top: 1px solid rgba(39, 189, 190, 0.2);
      padding: 6px 8px calc(6px + var(--safe-bottom));
      justify-content: space-around;
      align-items: stretch;
      gap: 4px;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 4px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s;
      flex: 1;
      min-height: 44px;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .tab-item:active { background: rgba(39, 189, 190, 0.1); }
    .tab-item .tab-icon {
      font-size: 20px;
      line-height: 1;
    }
    .tab-item .tab-label {
      font-size: 10px;
      color: var(--gray-400);
      letter-spacing: 0.2px;
    }
    .tab-item.active .tab-icon { color: var(--teal); }
    .tab-item.active .tab-label { color: var(--teal); }
  }

  @media (max-width: 480px) {
    .stat-row {
      grid-template-columns: repeat(3, 1fr);
    }
    header h1 { font-size: 13px; }
    .content-card h2 { font-size: 16px; gap: 8px; }
    .content-card h2 .section-icon { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <h1><span>PROJECT 3</span> &nbsp;·&nbsp; Obsidian RAG System v5.0</h1>
  <div class="header-meta">
    <span>Feb 24, 2026</span>
    <span class="status-badge done">Complete — v1.0 Shipped</span>
  </div>
</header>

<nav class="sidebar">
  <div class="sidebar-section">
    <h3>Quick Views</h3>
    <div class="preset-row" id="presets"></div>
  </div>
  <div class="sidebar-section">
    <h3>Sections</h3>
    <div id="nav-items"></div>
  </div>
  <div class="sidebar-section">
    <h3>Architecture Options</h3>
    <div id="arch-nav"></div>
  </div>
</nav>

<main class="main" id="main-content"></main>

<!-- Mobile Tab Bar -->
<nav class="mobile-tab-bar" id="mobile-tabs">
  <div class="tab-item active" onclick="mobileTab('overview')" data-tab="overview">
    <span class="tab-icon">◆</span>
    <span class="tab-label">Overview</span>
  </div>
  <div class="tab-item" onclick="mobileTab('qmd')" data-tab="qmd">
    <span class="tab-icon">⌕</span>
    <span class="tab-label">Search</span>
  </div>
  <div class="tab-item" onclick="mobileTab('decisions')" data-tab="decisions">
    <span class="tab-icon">⚡</span>
    <span class="tab-label">Decision</span>
  </div>
  <div class="tab-item" onclick="mobileTab('sessions')" data-tab="sessions">
    <span class="tab-icon">◷</span>
    <span class="tab-label">History</span>
  </div>
  <div class="tab-item" onclick="toggleSheet()" data-tab="sheet">
    <span class="tab-icon">☰</span>
    <span class="tab-label">All</span>
  </div>
</nav>

<!-- Slide-up Navigation Sheet -->
<div class="sheet-backdrop" id="sheet-backdrop" onclick="closeSheet()"></div>
<div class="nav-sheet" id="nav-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-section">
    <h3>Quick Views</h3>
    <div class="sheet-presets" id="sheet-presets"></div>
  </div>
  <div class="sheet-section">
    <h3>All Sections</h3>
    <div id="sheet-nav-items"></div>
  </div>
  <div class="sheet-section">
    <h3>Architecture Options</h3>
    <div id="sheet-arch-nav"></div>
  </div>
</div>

<script>
// ─── State ───
const state = {
  activeSection: 'overview',
  selectedArch: null,
  view: 'all',
  sheetOpen: false
};

// ─── Data ───
const SECTIONS = [
  { id: 'overview', label: 'Project Overview', icon: '◆', tag: 'done', tagLabel: 'Complete' },
  { id: 'workflow', label: 'Research Workflow', icon: '→', tag: 'done', tagLabel: 'Designed' },
  { id: 'vault', label: 'Vault & Content', icon: '▤', tag: 'done', tagLabel: '257 Books' },
  { id: 'splitting', label: 'Splitting Strategy', icon: '✂', tag: 'done', tagLabel: 'Tested' },
  { id: 'metadata', label: 'Metadata & Registry', icon: '⬡', tag: 'done', tagLabel: 'Finalized' },
  { id: 'scripts', label: 'Scripts & Tools', icon: '⚙', tag: 'done', tagLabel: '7 Built' },
  { id: 'qmd', label: 'Qdrant Search Engine', icon: '⌕', tag: 'done', tagLabel: 'Indexed' },
  { id: 'sessions', label: 'Session History', icon: '◷', tag: 'done', tagLabel: '5 Sessions' },
  { id: 'decisions', label: 'Architecture Decision', icon: '⚡', tag: 'done', tagLabel: 'Decided' },

// Tabs that map to sections (for highlighting active mobile tab)
const TAB_SECTIONS = ['overview', 'qmd', 'decisions', 'sessions'];

// ─── Mobile Tab ───
function mobileTab(sectionId) {
  closeSheet();
  selectSection(sectionId);
  updateMobileTabs();
}

function updateMobileTabs() {
  document.querySelectorAll('.tab-item').forEach(el => {
    const tab = el.dataset.tab;
    if (tab === 'sheet') {
      el.classList.toggle('active', state.sheetOpen);
    } else {
      el.classList.toggle('active', tab === state.activeSection);
    }
  });
}

// ─── Sheet ───
function toggleSheet() {
  if (state.sheetOpen) {
    closeSheet();
  } else {
    openSheet();
  }
}

function openSheet() {
  state.sheetOpen = true;
  const backdrop = document.getElementById('sheet-backdrop');
  const sheet = document.getElementById('nav-sheet');
  backdrop.style.display = 'block';
  requestAnimationFrame(() => {
    backdrop.classList.add('visible');
    sheet.classList.add('open');
  });
  renderSheet();
  updateMobileTabs();
}

function closeSheet() {
  state.sheetOpen = false;
  const backdrop = document.getElementById('sheet-backdrop');
  const sheet = document.getElementById('nav-sheet');
  sheet.classList.remove('open');
  backdrop.classList.remove('visible');
  setTimeout(() => { backdrop.style.display = 'none'; }, 200);
  updateMobileTabs();
}

function renderSheet() {
  const presetsEl = document.getElementById('sheet-presets');
  presetsEl.innerHTML = PRESETS.map(p => `
    <button class="preset-btn ${state.view === p.id ? 'active' : ''}" onclick="sheetSetView('${p.id}')">${p.label}</button>
  `).join('');

  const navEl = document.getElementById('sheet-nav-items');
  navEl.innerHTML = SECTIONS.map(s => `
    <div class="sheet-item ${state.activeSection === s.id ? 'active' : ''}" onclick="sheetSelectSection('${s.id}')">
      <span class="icon">${s.icon}</span>
      <span class="label">${s.label}</span>
      <span class="tag tag-${s.tag}">${s.tagLabel}</span>
    </div>
  `).join('');

  const archEl = document.getElementById('sheet-arch-nav');
  archEl.innerHTML = ARCH_OPTIONS.map(a => `
    <div class="sheet-item ${state.selectedArch === a.id ? 'active' : ''}" onclick="sheetSelectArch('${a.id}')">
      <span class="icon" style="font-weight:700;">§${a.id}</span>
      <span class="label">${a.name}</span>
    </div>
  `).join('');
}

function sheetSelectSection(id) {
  closeSheet();
  selectSection(id);
  updateMobileTabs();
}

function sheetSetView(id) {
  closeSheet();
  setView(id);
  updateMobileTabs();
}

function sheetSelectArch(id) {
  closeSheet();
  selectArch(id);
  updateMobileTabs();
}

// ─── Render Navigation (Desktop Sidebar) ───
function renderNav() {
  const navEl = document.getElementById('nav-items');
  navEl.innerHTML = SECTIONS.map(s => `
    <div class="nav-item ${state.activeSection === s.id ? 'active' : ''}" onclick="selectSection('${s.id}')">
      <span class="icon">${s.icon}</span>
      <span class="label">${s.label}</span>
      <span class="tag tag-${s.tag}">${s.tagLabel}</span>
    </div>
  `).join('');

  const presetEl = document.getElementById('presets');
  presetEl.innerHTML = PRESETS.map(p => `
    <button class="preset-btn ${state.view === p.id ? 'active' : ''}" onclick="setView('${p.id}')">${p.label}</button>
  `).join('');

  const archEl = document.getElementById('arch-nav');
  archEl.innerHTML = ARCH_OPTIONS.map(a => `
    <div class="nav-item ${state.selectedArch === a.id ? 'active' : ''}" onclick="selectArch('${a.id}')">
      <span class="icon" style="font-weight:700;">§${a.id}</span>
      <span class="label">${a.name}</span>
    </div>
  `).join('');
}

function selectSection(id) {
  state.activeSection = id;
  state.view = 'all';
  renderNav();
  renderContent();
  updateMobileTabs();
}

function selectArch(id) {
  state.selectedArch = state.selectedArch === id ? null : id;
  state.activeSection = 'decisions';
  state.view = 'all';
  renderNav();
  renderContent();
  updateMobileTabs();
}

function setView(id) {
  state.view = id;
  if (id === 'status') state.activeSection = 'overview';
  if (id === 'decision') state.activeSection = 'decisions';
  if (id === 'technical') state.activeSection = 'qmd';
  renderNav();
  renderContent();
  updateMobileTabs();
}

// ─── Content Renderers ───
function renderContent() {
  const main = document.getElementById('main-content');

  if (state.view === 'status') {
    main.innerHTML = renderStatusView();
  } else if (state.view === 'decision') {
    main.innerHTML = renderDecisionView();
  } else if (state.view === 'technical') {
    main.innerHTML = renderTechnicalView();
  } else {
    main.innerHTML = renderSection(state.activeSection);
  }
  main.scrollTop = 0;
}

function renderSection(id) {
  const renderers = {
    overview: renderOverview,
    workflow: renderWorkflow,
    vault: renderVault,
    splitting: renderSplitting,
    metadata: renderMetadata,
    scripts: renderScripts,
    qmd: renderQmd,
    sessions: renderSessions,
    decisions: renderDecisionView,
    next: renderNext,
  };
  return (renderers[id] || renderOverview)();
}
